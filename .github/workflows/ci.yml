
name: CI Checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check-api:
    name: Test & Build API (Backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: shoe_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shoe_store_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cài đặt dependencies
        run: npm install

      - name: Khởi tạo Prisma Client
        run: npm --workspace=apps/api exec -- prisma generate

      - name: Đồng bộ schema PostgreSQL
        run: npm --workspace=apps/api exec -- prisma db push
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/shoe_store_test?schema=public

      - name: Kiểm tra Seed dữ liệu
        run: npm --workspace=apps/api run seed
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/shoe_store_test?schema=public

      - name: Build Backend
        run: npm --workspace=apps/api run build

  check-web:
    name: Lint & Build Web (Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cài đặt dependencies
        run: npm install

      - name: Chạy ESLint
        run: npm --workspace=apps/web run lint

      - name: Build Frontend
        run: npm --workspace=apps/web run build
