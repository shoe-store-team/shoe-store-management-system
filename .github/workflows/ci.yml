name: CI Checks

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  check-api:
    name: Test & Build API (Backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: shoe_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài đặt dependencies Backend
        run: npm install

      - name: Khởi tạo Prisma Client
        run: npx prisma generate

      - name: Đồng bộ schema vào PostgreSQL Container
        run: npx prisma db push
        env:
          DATABASE_URL: "postgresql://postgres:password123@localhost:5432/shoe_store_test?schema=public"

      - name: Kiểm tra chạy Seed dữ liệu mẫu
        run: npm run seed
        env:
          DATABASE_URL: "postgresql://postgres:password123@localhost:5432/shoe_store_test?schema=public"

      - name: Kiểm tra TypeScript Build Backend
        run: npm run build

  check-web:
    name: Lint & Build Web (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài đặt dependencies Frontend
        run: npm install

      - name: Chạy kiểm tra ESLint
        run: npm run lint

      - name: Kiểm tra TypeScript & Vite Build Frontend
        run: npm run build