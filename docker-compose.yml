services:
  postgres:
    image: postgres:18.6
    container_name: shoe-store-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: shoe_store
    ports:
      - "5432:5432"
    volumes:
      - shoe_store_existing_data:/var/lib/postgresql

volumes:
  shoe_store_existing_data:
    external: true
    name: 1db54859ba3f457d3c93bd305197982401340bb67b44814ecd70ff8bfdf71e6e